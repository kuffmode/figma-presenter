<!DOCTYPE html><meta charset="utf-8"><title>engine test</title>
<script type="module">
import { Engine } from "../app/engine.js";
function img(kind, w, h, text) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
  if (kind === "brain") { for (let i = 0; i < 40; i++) { const x = w/2 + Math.cos(i*2.4)*(w*.08+i*w*.006), y = h/2 + Math.sin(i*2.4)*(h*.07+i*h*.006), r = h*.13-i; const grd = g.createRadialGradient(x-r/3,y-r/3,0,x,y,r); grd.addColorStop(0,`hsl(${200+i*4},60%,${80-i}%)`); grd.addColorStop(1,`hsl(${220+i*3},50%,${35-i/2}%)`); g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); } }
  else if (kind === "photo") { const grd = g.createLinearGradient(0,0,w,h); grd.addColorStop(0,"#f4f4f4"); grd.addColorStop(1,"#222"); g.fillStyle=grd; g.fillRect(0,0,w,h); g.fillStyle="#888"; g.beginPath(); g.arc(w/2,h/2,w*.3,0,7); g.fill(); }
  else if (kind === "paper") { g.fillStyle="#f3ead8"; g.fillRect(0,0,w,h); for (let i=0;i<4000;i++){ g.fillStyle=`rgba(120,90,40,${Math.random()*.08})`; g.fillRect(Math.random()*w,Math.random()*h,3,3);} }
  else { g.fillStyle = kind; g.font = `${h*0.7}px Georgia`; g.textBaseline = "middle"; g.fillText(text, 0, h/2); }
  return c;
}

};

    { key: "Container · 01", name: "box", kind: "solid", rect: [56,446,1670,188], color: [0,0,0,1], radius: 0, blend: "PASS_THROUGH" },
    { key: "Container · 01/Text · long", name: "t1", kind: "bitmap", rect: [66,456,1650,168], asset: "title1", blend: "PASS_THROUGH" },

window.run = async (PW, PH, steps) => {
  const log = [];

  engine.setDeck(deck, { bitmap: n => createImageBitmap(assets[n]), shaderSource: v => fetch("./silk.js").then(r => r.text()) });

  const out = [];
  for (const [a, b, t, style] of steps) {
    engine.draw(a, b, t, style || "SMART_ANIMATE", 0, target.createView());
    const buf = engine.device.createBuffer({ size: PW * PH * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = engine.device.createCommandEncoder();
    enc.copyTextureToBuffer({ texture: target }, { buffer: buf, bytesPerRow: PW * 4 }, [PW, PH]);
    engine.device.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const px = new Uint8ClampedArray(buf.getMappedRange().slice(0));
    if (engine.format === "bgra8unorm") for (let i = 0; i < px.length; i += 4) { const r = px[i]; px[i] = px[i + 2]; px[i + 2] = r; }
    const c = document.createElement("canvas"); c.width = PW; c.height = PH; c.getContext("2d").putImageData(new ImageData(px, PW, PH), 0, 0);
    out.push(c.toDataURL("image/png"));
  }
  return { log, out, sharp: [...engine.instances.values()].map(i => i.sharp), format: engine.format };
};
