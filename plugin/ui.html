<style>
  body { font: 12px/1.45 Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 16px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  h1 { font-size: 13px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--figma-color-text-secondary, #666); }
  label { display: block; margin-bottom: 10px; color: var(--figma-color-text-secondary, #666); }
  input, select { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 8px; font: 12px ui-monospace, Menlo, monospace; color: inherit; background: var(--figma-color-bg-secondary, #f5f5f5); border: 1px solid var(--figma-color-border, #ddd); border-radius: 6px; }
  button { width: 100%; padding: 9px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: var(--figma-color-bg-brand, #0d99ff); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #bar { height: 4px; background: var(--figma-color-bg-secondary, #eee); border-radius: 2px; overflow: hidden; margin: 12px 0 6px; }
  #fill { height: 100%; width: 0; background: var(--figma-color-bg-brand, #0d99ff); }
  #status { min-height: 18px; }
  #log { margin-top: 8px; max-height: 110px; overflow: auto; white-space: pre-wrap; color: var(--figma-color-text-secondary, #666); font-size: 11px; }
  .err { color: var(--figma-color-text-danger, #c00) !important; }
</style>
<h1>Publish to Presenter</h1>
<p id="deckname"></p>
<label>Decks repository<input id="repo" placeholder="owner/repository" spellcheck="false"></label>
<label>GitHub access token (contents: read and write)<input id="token" type="password" placeholder="github_pat_…" spellcheck="false"></label>
<label>Picture quality<select id="scale"><option value="2">Standard (2×)</option><option value="3">High (3×, larger upload)</option><option value="1">Draft (1×, fastest)</option></select></label>
<button id="go">Publish</button>
<div id="bar"><div id="fill"></div></div>
<div id="status"></div>
<div id="log"></div>
<script>
const $ = id => document.getElementById(id);
const API = "https://api.github.com";
const PACK_LIMIT = 300 * 1024;          // pictures smaller than this are bundled per slide
const send = msg => parent.postMessage({ pluginMessage: msg }, "*");
const assets = new Map();               // local id -> { bytes, mime }
let busy = false;

function status(text, fraction, isError) {
  $("status").textContent = text; $("status").className = isError ? "err" : "";
  if (fraction != null) $("fill").style.width = Math.round(fraction * 100) + "%";
}
function finish() { busy = false; $("go").disabled = false; }

async function hashName(bytes) {
  try {
    const d = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
    return Array.from(d.slice(0, 16), b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let a = 0x811c9dc5, b = 0x01000193 ^ bytes.length;
    for (let i = 0; i < bytes.length; i++) { a = Math.imul(a ^ bytes[i], 0x01000193); b = Math.imul(b + bytes[i], 0x85ebca6b) ^ (b >>> 13); }
    return (a >>> 0).toString(16).padStart(8, "0") + (b >>> 0).toString(16).padStart(8, "0") + bytes.length.toString(16);
  }
}

function base64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function github(repo, token) {
  let lastWrite = 0;
  return async function call(method, path, body) {
    for (let attempt = 0; ; attempt++) {
      if (method !== "GET") {                       // GitHub limits how fast content may be created
        const wait = lastWrite + 750 - Date.now();
        if (wait > 0) await new Promise(r => setTimeout(r, wait));
        lastWrite = Date.now();
      }
      const res = await fetch(`${API}/repos/${repo}${path}`, {
        method, body: body ? JSON.stringify(body) : undefined,
        headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}`, "X-GitHub-Api-Version": "2022-11-28" },
      });
      if (res.ok) return res.json();
      const retryAfter = Number(res.headers.get("retry-after"));
      if ((res.status === 429 || res.status === 403) && attempt < 4 && (retryAfter || res.headers.get("x-ratelimit-remaining") === "0" || /secondary rate/i.test(await res.clone().text()))) {
        const pause = (retryAfter || 30 * (attempt + 1)) * 1000;
        status(`GitHub asked to slow down; continuing in ${Math.round(pause / 1000)} s…`);
        await new Promise(r => setTimeout(r, pause));
        continue;
      }
      let detail = ""; try { detail = (await res.json()).message || ""; } catch (e) {}
      const err = new Error(`GitHub ${res.status}${detail ? ": " + detail : ""}`); err.status = res.status; throw err;
    }
  };
}

async function upload(deck, warnings) {
  const repo = $("repo").value.trim(), token = $("token").value.trim();
  const gh = github(repo, token);
  status("Preparing upload…", 0);

  // Give every picture a name from its content, so unchanged pictures are never uploaded twice.
  const nameOf = new Map(), content = new Map();           // local id -> name, name -> { bytes, mime }
  for (const [id, a] of assets) {
    const name = (await hashName(a.bytes)) + (a.mime === "image/jpeg" ? ".jpg" : ".png");
    nameOf.set(id, name); if (!content.has(name)) content.set(name, a);
  }
  const base = `decks/${deck.id}`;
  const files = new Map();                                   // repo path -> bytes
  const where = {};                                          // asset name -> { path, offset?, length?, type }
  deck.slides.forEach(slide => {
    slide.thumb = nameOf.get(slide.thumb);
    const small = [];
    for (const layer of slide.layers) if (layer.asset) layer.asset = nameOf.get(layer.asset);
    for (const name of [slide.thumb, ...slide.layers.map(l => l.asset).filter(Boolean)]) {
      if (where[name]) continue;
      const a = content.get(name);
      if (a.bytes.length >= PACK_LIMIT) { const path = `${base}/assets/${name}`; files.set(path, a.bytes); where[name] = { path, type: a.mime }; }
      else { where[name] = { type: a.mime, pending: true }; small.push(name); }
    }
    if (small.length) slide._small = small;
  });
  for (const slide of deck.slides) {
    if (!slide._small) continue;
    const total = slide._small.reduce((n, name) => n + content.get(name).bytes.length, 0);
    const pack = new Uint8Array(total); let offset = 0;
    for (const name of slide._small) { const b = content.get(name).bytes; pack.set(b, offset); where[name].offset = offset; where[name].length = b.length; offset += b.length; }
    const path = `${base}/packs/${await hashName(pack)}.bin`;
    files.set(path, pack);
    for (const name of slide._small) { where[name].path = path; delete where[name].pending; }
    delete slide._small;
  }

  // What is already in the repository?
  const info = await gh("GET", "");
  const branch = info.default_branch;
  let ref;
  try { ref = await gh("GET", `/git/ref/heads/${branch}`); }
  catch (err) { throw new Error("The decks repository is empty. Add a README to it on GitHub first, then publish again."); }
  const commit = await gh("GET", `/git/commits/${ref.object.sha}`);
  const tree = await gh("GET", `/git/trees/${commit.tree.sha}?recursive=1`);
  const existing = new Map(tree.tree.filter(e => e.type === "blob").map(e => [e.path, e.sha]));

  const shaOf = new Map(), entries = [];
  const todo = [...files.keys()].filter(p => !existing.has(p));
  const bytesTotal = todo.reduce((n, p) => n + files.get(p).length, 0);
  let bytesDone = 0, count = 0;
  for (const path of files.keys()) if (existing.has(path)) shaOf.set(path, existing.get(path));
  for (const path of todo) {
    status(`Uploading ${++count} of ${todo.length} (${(bytesTotal / 1048576).toFixed(1)} MB in total)`, 0.5 + 0.45 * (bytesTotal ? bytesDone / bytesTotal : 1));
    const blob = await gh("POST", "/git/blobs", { content: base64(files.get(path)), encoding: "base64" });
    shaOf.set(path, blob.sha); entries.push({ path, mode: "100644", type: "blob", sha: blob.sha });
    bytesDone += files.get(path).length;
  }

  deck.assets = {};
  for (const name in where) {
    const w = where[name], entry = { blob: shaOf.get(w.path), type: w.type };
    if (w.length != null) { entry.offset = w.offset; entry.length = w.length; }
    deck.assets[name] = entry;
  }
  status("Finishing…", 0.97);
  entries.push({ path: `${base}/deck.json`, mode: "100644", type: "blob", content: JSON.stringify(deck) });
  // Remove this deck's files that the new version no longer uses.
  for (const path of existing.keys()) if (path.startsWith(base + "/") && path !== `${base}/deck.json` && !files.has(path)) entries.push({ path, mode: "100644", type: "blob", sha: null });
  const newTree = await gh("POST", "/git/trees", { base_tree: commit.tree.sha, tree: entries });
  const newCommit = await gh("POST", "/git/commits", { message: `Publish ${deck.name}`, tree: newTree.sha, parents: [ref.object.sha] });
  await gh("PATCH", `/git/refs/heads/${branch}`, { sha: newCommit.sha });

  const missing = Object.keys(deck.shaders).filter(v => !existing.has(`shaders/${v}.js`));
  const notes = [...warnings];
  if (missing.length) notes.push(`Shader code not yet in the repository for: ${missing.map(v => deck.shaders[v].name || v.slice(0, 8)).join(", ")}. The presenter will ask for it.`);
  const noVideo = Object.keys(deck.videos || {}).filter(h => ![...existing.keys()].some(path => path.startsWith(`videos/${h}`)));
  if (noVideo.length) notes.push(`Video file not yet in the repository for: ${noVideo.map(h => deck.videos[h].name).join(", ")}. Figma does not let plugins read video files; the presenter will ask for the file once.`);
  status(`Published ${deck.slides.length} slides (${todo.length} new upload${todo.length === 1 ? "" : "s"}).`, 1);
  $("log").textContent = notes.join("\n");
}

onmessage = async e => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === "settings") { $("repo").value = m.repo; $("token").value = m.token; $("deckname").textContent = m.deckName; }
  else if (m.type === "asset") assets.set(m.id, { bytes: m.bytes instanceof Uint8Array ? m.bytes : new Uint8Array(m.bytes), mime: m.mime });
  else if (m.type === "progress") status(`Exporting slide ${m.done + 1} of ${m.total}…`, 0.5 * m.done / m.total);
  else if (m.type === "error") { status(m.message, null, true); finish(); }
  else if (m.type === "deck") {
    try { await upload(m.deck, m.warnings || []); }
    catch (err) { status("Upload failed: " + err.message, null, true); }
    assets.clear(); finish();
  }
};

$("go").onclick = () => {
  if (busy) return;
  const repo = $("repo").value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, ""), token = $("token").value.trim();
  if (!/^[^/\s]+\/[^/\s]+$/.test(repo) || !token) { status("Enter the repository as owner/name and an access token.", null, true); return; }
  $("repo").value = repo;
  busy = true; $("go").disabled = true; $("log").textContent = ""; assets.clear();
  send({ type: "save-settings", repo, token });
  status("Exporting…", 0);
  send({ type: "publish", scale: Number($("scale").value) });
};
send({ type: "init" });
</script>
